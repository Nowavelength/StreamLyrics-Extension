<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D35" />
      <stop offset="100%" stop-color="#18181F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with border -->
  <circle cx="128" cy="128" r="116" fill="url(#bgGrad)" stroke="#30D158" stroke-width="8" />
  
  <!-- Music Notes Icon -->
  <g fill="none" stroke="#34C759" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Eighth Note heads (filled using svg shape) -->
    <ellipse cx="94" cy="166" rx="18" ry="12" fill="#34C759" stroke="none" />
    <ellipse cx="150" cy="150" rx="18" ry="12" fill="#34C759" stroke="none" />
    <!-- Stems -->
    <line x1="110" y1="166" x2="110" y2="86" />
    <line x1="166" y1="150" x2="166" y2="70" />
    <!-- Connecting beam -->
    <path d="M110,86 L166,70" stroke-width="16" />
    
    <!-- Sound Waves / Lyric vibrations to the sides -->
    <path d="M58,114 C52,122 52,134 58,142" stroke-width="10" />
    <path d="M198,114 C204,122 204,134 198,142" stroke-width="10" />
  </g>
</svg>