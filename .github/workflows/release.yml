name: Release Downloads

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release zips
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release packaging test
        run: npm run test:release-package

      - name: Run KWin helper test
        run: npm run test:kwin-helper

      - name: Verify bundled fonts
        run: npm run verify:font

      - name: Build extension
        run: npm run build

      - name: Package Windows and Linux downloads
        run: npm run package:release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/StreamLyrics-Windows.zip
            release/StreamLyrics-Linux.zip
